# Bundled base config loaded before the user's ~/.config/ghostty/config.
# User settings always win; this only applies when a key is not set by the user.

font-family = "SF Mono"
font-size = 13
# Follow the macOS appearance. GhosttyRuntime propagates light/dark via
# ghostty_app_set_color_scheme, which is what selects between these two.
# "One Half Dark" uses #282c34 — the same background Ghostty falls back to
# with no theme set — so dark mode is unchanged from before this was set.
theme = light:One Half Light,dark:One Half Dark
cursor-style = block
cursor-style-blink = false
window-padding-x = 8
window-padding-y = 6
# Cap scrollback by line count; leave the byte cap at Ghostty's own default
# (50 MB) so it acts purely as a memory backstop. Whichever limit is reached
# first evicts scrollback. Ghostty compresses idle scrollback pages by default,
# so 100k lines costs far less resident memory than the raw figure suggests.
scrollback-limit-lines = 100000
